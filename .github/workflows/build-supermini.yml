name: Build Dasai Mochi - ESP32-C3 SuperMini

on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/**'
      - 'platformio.ini'
      - '.github/workflows/build-supermini.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install dependencies
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e esp32c3

      - name: Prepare firmware files
        run: |
          mkdir -p dist
          cp .pio/build/esp32c3/bootloader.bin dist/DasaiMochi-SuperMini-bootloader.bin
          cp .pio/build/esp32c3/partitions.bin dist/DasaiMochi-SuperMini-partitions.bin
          cp .pio/build/esp32c3/firmware.bin dist/DasaiMochi-SuperMini-firmware.bin
          python -m esptool --chip esp32c3 merge-bin \
            -o dist/DasaiMochi-SuperMini-merged.bin \
            --flash-mode dio --flash-size 4MB \
            0x0 .pio/build/esp32c3/bootloader.bin \
            0x8000 .pio/build/esp32c3/partitions.bin \
            0x10000 .pio/build/esp32c3/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: DasaiMochi-SuperMini-firmware
          path: dist/
          
